    <path d="M 182 82 Q 183 87 188 88 Q 183 89 182 94 Q 181 89 176 88 Q 181 87 182 82 Z" fill="#ffffff" />
    <path d="M 174 98 Q 175 101 178 102 Q 175 103 174 106 Q 173 103 170 102 Q 173 101 174 98 Z" fill="#38bdf8" />
